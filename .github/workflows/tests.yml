name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-checks:
    runs-on: ubuntu-24.04
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run local Bash suite (syntax, lint, CLI, packer and unpacker)
        run: bash ./tester.sh
      - name: Upload Linux tester log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tester-log-linux
          path: tmp/tester_log_lin.md

  windows-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run local Batch suite (CLI, packer and unpacker)
        run: .\tester.bat
        shell: cmd
      - name: Upload Windows tester log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tester-log-windows
          path: tmp/tester_log_win.md

  docker-smoke:
    runs-on: ubuntu-24.04
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run local Docker smoke
        run: bash ./tester.sh "Docker Smoke"
      - name: Upload Docker smoke log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tester-log-docker
          path: tmp/tester_log_lin.md

  podman-smoke:
    runs-on: ubuntu-24.04
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      - name: Run local Podman smoke
        run: bash ./tester.sh "Podman Smoke"
      - name: Upload Podman smoke log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tester-log-podman
          path: tmp/tester_log_lin.md
