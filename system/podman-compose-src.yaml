# A pod cannot share its user namespace with a keep-id service.
x-podman:
  in_pod: false

services:
  builder-src-openwrt:
    userns_mode: "keep-id:uid=1000,gid=1000"

  builder-src-oldwrt:
    userns_mode: "keep-id:uid=1000,gid=1000"
